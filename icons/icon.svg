<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d50000"/>
      <stop offset="100%" stop-color="#b71c1c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffee58"/>
      <stop offset="100%" stop-color="#fbc02d"/>
    </linearGradient>
  </defs>
  <!-- 背景円 -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <rect x="20" y="20" width="472" height="472" rx="90" fill="none" stroke="url(#gold)" stroke-width="14"/>

  <!-- 煙突の煙 -->
  <circle cx="170" cy="120" r="30" fill="#ffffff" opacity="0.8"/>
  <circle cx="210" cy="85" r="42" fill="#ffffff" opacity="0.9"/>
  <circle cx="270" cy="65" r="54" fill="#ffffff"/>

  <!-- 汽車ボディー -->
  <!-- 煙突 -->
  <path d="M150 170 L190 170 L180 230 L160 230 Z" fill="#263238" stroke="#ffd600" stroke-width="6"/>
  <!-- ボイラー本体 -->
  <rect x="130" y="220" width="160" height="130" rx="30" fill="#1565c0" stroke="#ffd600" stroke-width="8"/>
  <!-- キャビン（運転席） -->
  <rect x="270" y="160" width="140" height="190" rx="20" fill="#d50000" stroke="#ffd600" stroke-width="8"/>
  <!-- 窓 -->
  <rect x="295" y="185" width="90" height="70" rx="14" fill="#e0f7fa" stroke="#263238" stroke-width="6"/>
  <!-- 窓から顔を出す金太郎 -->
  <circle cx="340" cy="225" r="24" fill="#ffccbc"/>
  <!-- 金太郎のおかっぱ髪 -->
  <path d="M316 225 Q340 195 364 225 Q364 205 340 205 Q316 205 316 225 Z" fill="#212121"/>
  <!-- ヘッドライト -->
  <path d="M130 250 L90 240 L90 280 L130 270 Z" fill="#ffee58" stroke="#263238" stroke-width="5"/>
  <ellipse cx="90" cy="260" rx="10" ry="20" fill="#fff" stroke="#ff8f00" stroke-width="4"/>
  <!-- カウキャッチャー（先頭バンパー） -->
  <polygon points="130,340 60,370 130,370" fill="#ffd600" stroke="#263238" stroke-width="6"/>

  <!-- 車輪 -->
  <circle cx="160" cy="370" r="42" fill="#37474f" stroke="#ffd600" stroke-width="7"/>
  <circle cx="160" cy="370" r="16" fill="#cfd8dc"/>
  <circle cx="250" cy="370" r="42" fill="#37474f" stroke="#ffd600" stroke-width="7"/>
  <circle cx="250" cy="370" r="16" fill="#cfd8dc"/>
  <circle cx="355" cy="360" r="54" fill="#37474f" stroke="#ffd600" stroke-width="8"/>
  <circle cx="355" cy="360" r="22" fill="#cfd8dc"/>

  <!-- ロッド棒 -->
  <line x1="160" y1="370" x2="355" y2="360" stroke="#ffd600" stroke-width="8" stroke-linecap="round"/>

  <!-- レール -->
  <line x1="40" y1="425" x2="472" y2="425" stroke="#eceff1" stroke-width="12" stroke-linecap="round"/>
  <line x1="40" y1="440" x2="472" y2="440" stroke="#455a64" stroke-width="10" stroke-linecap="round"/>

  <!-- タイトル文字「金」バッジ -->
  <circle cx="210" cy="285" r="26" fill="#ffd600" stroke="#d50000" stroke-width="4"/>
  <text x="210" y="297" font-size="28" font-weight="900" fill="#d50000" text-anchor="middle" font-family="sans-serif">金</text>
</svg>